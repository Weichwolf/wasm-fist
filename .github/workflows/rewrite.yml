name: Rewrite checks
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  native-and-wasm:
    env:
      PYTHONPYCACHEPREFIX: /tmp/wasm-fist-python-cache
    runs-on: ubuntu-24.04
    container: debian:13
    steps:
      - name: Install toolchain
        run: |
          apt-get update
          apt-get install -y git ca-certificates clang clang-format clang-tidy cmake ninja-build emscripten nodejs npm python3 chromium pkg-config libsdl2-dev xvfb xdotool imagemagick
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Native and WASM builds and probes
        run: bash tools/rewrite/build.sh all
      - name: Strict formatting and clang-tidy
        run: python3 tools/rewrite/check_style.py
      - name: Install pinned browser checks outside checkout
        run: |
          mkdir -p /tmp/wasm-fist-browser-tools
          cp tools/rewrite/browser/package*.json /tmp/wasm-fist-browser-tools/
          npm ci --prefix /tmp/wasm-fist-browser-tools --ignore-scripts --no-audit --no-fund
      - name: Actual browser rendering and worker startup
        run: python3 tools/rewrite/verify_browser.py
      - name: Constructed terrain scene and complete browser presentation
        run: |
          python3 tools/rewrite/prepare_terrain_preview.py
          python3 tools/rewrite/verify_browser.py --terrain
      - name: Controlled scene input and complete native/browser presentation
        run: |
          rm -rf /tmp/wasm-fist-rewrite/wasm/assets
          python3 tools/rewrite/prepare_driving_preview.py
          python3 tools/rewrite/verify_browser.py --driving
          python3 tools/rewrite/verify_driving_native.py --scenario /tmp/wasm-fist-rewrite/wasm/assets/TEST.FSG --assets /tmp/wasm-fist-rewrite/wasm/assets
      - name: Canonical mission scene ownership and native/browser presentation
        run: |
          rm -rf /tmp/wasm-fist-rewrite/wasm/assets
          python3 tools/rewrite/prepare_driving_preview.py --mission
          python3 tools/rewrite/verify_browser.py --driving
          python3 tools/rewrite/verify_driving_native.py --mission --scenario /tmp/wasm-fist-rewrite/wasm/assets/TEST.FSG --assets /tmp/wasm-fist-rewrite/wasm/assets
